server:
  address: 0.0.0.0
  port: 9000
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-stacktrace: never
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db_agendify
    username: agendify
    password: agendify
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    root: INFO
agendify:
  bootstrap:
    enabled: true
  auth:
    token-secret: ${AGENDIFY_AUTH_SECRET:agendify-dev-secret}
    token-days: 30
    google:
      enabled: true
      client-id: ${GOOGLE_CLIENT_ID:${VITE_GOOGLE_CLIENT_ID:}}
      token-info-base-url: https://oauth2.googleapis.com
  chatbot:
    gemini:
      enabled: true
      base-url: https://generativelanguage.googleapis.com
      api-key: ${GEMINI_API_KEY:${API_KEY_GEMINI:}}
      model: gemini-2.0-flash

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/db_agendify
agendify:
  bootstrap:
    enabled: true
  auth:
    token-secret: ${AGENDIFY_AUTH_SECRET:agendify-dev-secret}
    token-days: 30
    google:
      enabled: true
      client-id: ${GOOGLE_CLIENT_ID:${VITE_GOOGLE_CLIENT_ID:}}
      token-info-base-url: https://oauth2.googleapis.com
  chatbot:
    gemini:
      enabled: true
      base-url: https://generativelanguage.googleapis.com
      api-key: ${GEMINI_API_KEY:${API_KEY_GEMINI:}}
      model: gemini-2.0-flash
